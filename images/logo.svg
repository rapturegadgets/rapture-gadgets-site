<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 120" width="940" height="240" role="img" aria-label="Rapture Gadgets — genuine phones, honest prices, Kampala">
  <defs>
    <linearGradient id="lbadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1E2C5E"/>
      <stop offset="55%" stop-color="#121A38"/>
      <stop offset="100%" stop-color="#080C1A"/>
    </linearGradient>
    <linearGradient id="lspark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFE287"/>
      <stop offset="45%"  stop-color="#FFC53D"/>
      <stop offset="100%" stop-color="#FF7A2F"/>
    </linearGradient>
    <radialGradient id="lglow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#FFC53D" stop-opacity="0.34"/>
      <stop offset="70%"  stop-color="#FFC53D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFC53D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lword" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFD86B"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
  </defs>

  <!-- ===== LOGO MARK ===== -->
  <g transform="translate(4,4) scale(0.9)">
    <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#lbadge)"/>
    <rect x="4.5" y="4.5" width="111" height="111" rx="29.5" fill="none" stroke="url(#lrim)" stroke-width="1.4"/>
    <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#lglow)"/>
    <path d="M30 24h15.5v72H30z" fill="url(#lspark)"/>
    <path d="M42 24h22.5c12.7 0 22.5 9.2 22.5 21.5S77.2 67 64.5 67H42V54.5h21c4.7 0 8-3.2 8-9s-3.3-9-8-9H42z" fill="url(#lspark)"/>
    <path d="M45.5 68.5h24.2L58.6 82.5h14.9L49.2 108l6.1-16.7H40.4z" fill="url(#lspark)"/>
    <g>
      <circle cx="93" cy="93" r="15.5" fill="#0A1024"/>
      <circle cx="93" cy="93" r="15.5" fill="none" stroke="#35E0C7" stroke-width="2.6"/>
      <path d="M86.4 93.4l4.6 4.7 9.3-10.4" fill="none" stroke="#35E0C7" stroke-width="4.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== WORDMARK ===== -->
  <text x="128" y="57" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="39" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">RAPTURE</text>
  <text x="292" y="57" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="39" font-weight="800" letter-spacing="1.5" fill="url(#lword)">GADGETS</text>

  <!-- Divider -->
  <rect x="129" y="70" width="330" height="1.5" rx="1" fill="#FFFFFF" opacity="0.16"/>

  <!-- Tagline -->
  <text x="129" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13.5" font-weight="500" letter-spacing="0.6" fill="#9FB0D6">
    Brand New &#183; UK Used &#183; Phone Repair &#183; Kampala
  </text>
</svg>
