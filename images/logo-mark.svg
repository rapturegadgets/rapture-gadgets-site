<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" role="img" aria-label="Rapture Gadgets logo mark">
  <defs>
    <!-- Badge background: deep space navy with a violet lift in the corner -->
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1E2C5E"/>
      <stop offset="55%" stop-color="#121A38"/>
      <stop offset="100%" stop-color="#080C1A"/>
    </linearGradient>
    <!-- The R is forged from a gold-to-amber "power" gradient -->
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFE287"/>
      <stop offset="45%"  stop-color="#FFC53D"/>
      <stop offset="100%" stop-color="#FF7A2F"/>
    </linearGradient>
    <!-- Soft inner glow behind the letter -->
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#FFC53D" stop-opacity="0.34"/>
      <stop offset="70%"  stop-color="#FFC53D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFC53D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#badge)"/>
  <rect x="4.5" y="4.5" width="111" height="111" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#glow)"/>

  <!-- Letter R: stem -->
  <path d="M30 24h15.5c0 0 0 0 0 0v72H30z" fill="url(#spark)"/>
  <!-- Letter R: bowl -->
  <path d="M42 24h22.5c12.7 0 22.5 9.2 22.5 21.5S77.2 67 64.5 67H42V54.5h21c4.7 0 8-3.2 8-9s-3.3-9-8-9H42z" fill="url(#spark)"/>
  <!-- Letter R: leg drawn as a lightning bolt = speed + power -->
  <path d="M45.5 68.5h24.2L58.6 82.5h14.9L49.2 108l6.1-16.7H40.4z" fill="url(#spark)"/>

  <!-- "Genuine & tested" seal: the trust mark for UK-used devices -->
  <g>
    <circle cx="93" cy="93" r="15.5" fill="#0A1024"/>
    <circle cx="93" cy="93" r="15.5" fill="none" stroke="#35E0C7" stroke-width="2.6"/>
    <path d="M86.4 93.4l4.6 4.7 9.3-10.4" fill="none" stroke="#35E0C7" stroke-width="4.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
